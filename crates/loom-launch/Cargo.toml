[package]
name = "loom-launch"
version = "0.2.0"
edition = "2021"
description = "Repository preparation, session provisioning, metadata assistance, and handoff."

[dependencies]
loom-forge = { path = "../loom-forge" }
weaver-core = { path = "../weaver-core" }
weaver-api = { path = "../weaver-api" }
tapestry = { path = "../tapestry" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
serial_test = "3"
