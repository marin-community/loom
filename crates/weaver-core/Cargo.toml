[package]
name = "weaver-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "weaver_core"
path = "src/lib.rs"

[dependencies]
# Domain types embedded in wire DTOs need a derivable schema so the registry can
# describe operations that carry them.
schemars = "1"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "process", "sync"] }
# Parsing the committed per-repo `.weaver/config.toml` (crate::repo_config).
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "fs", "process", "sync", "rt-multi-thread"] }
