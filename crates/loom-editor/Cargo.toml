[package]
name = "loom-editor"
version = "0.2.0"
edition = "2021"
description = "Live terminal and embedded-editor attachment for Loom sessions."

[dependencies]
loom-core = { path = "../loom-core" }
tapestry = { path = "../tapestry" }
weaver-core = { path = "../weaver-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
