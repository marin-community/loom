[package]
name = "loom-forge"
version = "0.2.0"
edition = "2021"
description = "GitHub integration, repository registry, and runtime lifecycle."

[features]
test-support = []

[dependencies]
loom-editor = { path = "../loom-editor" }
weaver-core = { path = "../weaver-core" }
weaver-api = { path = "../weaver-api" }
tapestry = { path = "../tapestry" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
jsonwebtoken = "9"
hmac = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
