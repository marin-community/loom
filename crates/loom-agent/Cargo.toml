[package]
name = "loom-agent"
version = "0.2.0"
edition = "2021"
description = "Loom's agent runtimes, ACP client, and trusted MCP mechanisms."

[dependencies]
loom-store = { path = "../loom-store" }
weaver-core = { path = "../weaver-core" }
weaver-api = { path = "../weaver-api" }
tapestry = { path = "../tapestry" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
serial_test = "3"
