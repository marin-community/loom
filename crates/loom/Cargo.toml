[package]
name = "loom"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[lib]
name = "loom"
path = "src/lib.rs"
# The CLI command groups' doc comments are clap help text — shell transcripts
# that `--help` prints verbatim, indented the way a terminal shows them.
# rustdoc reads an indented block as Rust and tries to compile it, so a
# `loom sessions launch "..."` example fails as a doctest. The crate has no real
# doctests to lose.
doctest = false

[[bin]]
name = "loom"
path = "src/bin/loom.rs"

[dependencies]
loom-ctx = { path = "../loom-ctx" }
loom-store = { path = "../loom-store" }
loom-agent = { path = "../loom-agent" }
loom-policy = { path = "../loom-policy" }
loom-core = { path = "../loom-core" }
loom-editor = { path = "../loom-editor" }
loom-forge = { path = "../loom-forge" }
loom-launch = { path = "../loom-launch" }
loom-watch = { path = "../loom-watch" }
loom-deliver = { path = "../loom-deliver" }
weaver-core = { path = "../weaver-core" }
weaver-api = { path = "../weaver-api" }
smartdoc = { path = "../smartdoc" }
tapestry = { path = "../tapestry" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `string`: operand defaults are computed at runtime from the declaration, so
# clap has to own the strings it shows in `--help` rather than borrow literals.
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
# Hex-encode the SHA-256 digests we store for API tokens and session cookies.
hex = "0.4"
percent-encoding = "2"
# Generate and load the machine-local Ed25519 keypair used to sign scoped
# automation JWTs. jsonwebtoken performs the actual JWT signing/verification.
ring = "0.17"
# Hidden (non-echoing) prompts for `loom setup secrets` — paste-once API keys
# shouldn't land in shell history or a terminal scrollback.
rpassword = "7"
# `rustls-tls` is needed for the GitHub OAuth token/user calls over HTTPS — the
# rest of loom's HTTP is loopback to its own daemon, but the OAuth dance reaches
# github.com directly.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deployment manifests are operator-authored YAML; JSON remains accepted
# because it is a YAML subset.
serde_yaml_ng = "0.10"
# SHA-256 for hashing API tokens / session ids at rest (high-entropy secrets, so
# a fast digest is right — the slow KDF above is only for low-entropy passwords).
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
# The authored `loom.toml` (crate::loom_config) — parsed *and* serialized, unlike
# weaver-core's read-only `.weaver/config.toml` loader.
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
# The watch engine materializes embedded builtin scripts to a scratch file
# before running them; the tests reuse it for fixtures.
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Used only by the integration suites (WebSocket clients, the stub upstream).
async-trait = "0.1"
futures-util = "0.3"
hmac = "0.12"
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
# The REST tests drive the GitHub App mock that lives with the App itself.
loom-forge = { path = "../loom-forge", features = ["test-support"] }
# Raw-body HTTP client for the scratch-upload integration test, plus `stream`
# for reading the ACP `/chat/stream` SSE body chunk by chunk.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
# A stub upstream (HTTP + WS echo) for the embedded-editor reverse-proxy test —
# stands in for code-server so the proxy is exercised without it installed.
axum = { version = "0.8", features = ["ws"] }
# The integration tests share a `TestServer` harness that sets process-global
# env (WEAVER_HOME / WEAVER_API / WEAVER_TAPESTRY_BIN), so they must not run
# concurrently within the test binary; `#[serial]` serializes them.
serial_test = "3"
# The webhook suite forges a valid `X-Hub-Signature-256` (hmac/sha2/hex) and
# installs a fake `GithubApi` (async-trait, anyhow::Result) into the test server.
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

# `build.rs` renders the SPA's generated types from the operation registry, so
# the frontend never carries a hand-maintained copy of the API's shapes.
[build-dependencies]
weaver-api = { path = "../weaver-api" }
